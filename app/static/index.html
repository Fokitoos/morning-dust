<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Morning Dust</title>
    <link rel="stylesheet" href="/static/styles.css?v=2">
</head>
<body>
    <div class="pager" id="pager">
        <!-- Page 1: dashboard -->
        <section class="page" data-page="dashboard">
            <main class="dashboard">
                <section class="widget weather" id="weather">
                    <div class="widget-label" id="weather-location">—</div>
                    <div class="widget-value" id="weather-temp">--°</div>
                    <div class="widget-condition" id="weather-condition">loading…</div>
                    <div class="widget-range">
                        <span class="range-item"><span class="range-arrow">↑</span><span id="weather-high">--°</span></span>
                        <span class="range-item"><span class="range-arrow">↓</span><span id="weather-low">--°</span></span>
                    </div>
                    <div class="widget-updated" id="weather-updated"></div>
                </section>

                <section class="widget clock" id="clock">
                    <div class="clock-time" id="clock-time">--:--</div>
                    <div class="clock-date" id="clock-date">—</div>
                    <section class="commute" id="commute">
                        <div class="commute-header">
                            <span class="widget-label">Commute</span>
                            <button class="commute-refresh" id="commute-refresh" type="button" aria-label="refresh">↻</button>
                        </div>
                        <div class="commute-route" id="commute-route">— → —</div>
                        <div class="commute-duration" id="commute-duration">--</div>
                        <div class="commute-meta" id="commute-meta">not configured</div>
                    </section>
                </section>

                <section class="widget todo" id="todo">
                    <div class="widget-label">Groceries</div>
                    <ul class="todo-list" id="todo-list"></ul>
                    <form class="todo-form" id="todo-form">
                        <input type="text" class="todo-input" id="todo-input" placeholder="add an item…" autocomplete="off">
                    </form>
                </section>

                <section class="widget calendar" id="calendar">
                    <div class="widget-label">Upcoming</div>
                    <ul class="calendar-list" id="calendar-list"></ul>
                    <div class="calendar-empty" id="calendar-empty"></div>
                </section>
            </main>
        </section>

        <!-- Page 2: tasks -->
        <section class="page" data-page="tasks">
            <div class="page-pane">
                <h1 class="page-title">Tasks</h1>
                <section class="widget tasks-widget">
                    <ul class="todo-list" id="task-list"></ul>
                    <form class="todo-form" id="task-form">
                        <input type="text" class="todo-input" id="task-input" placeholder="add a task…" autocomplete="off">
                    </form>
                </section>
            </div>
        </section>
    </div>

    <!-- Pager navigation -->
    <button class="pager-arrow pager-prev" id="pager-prev" type="button" aria-label="previous page">‹</button>
    <button class="pager-arrow pager-next" id="pager-next" type="button" aria-label="next page">›</button>
    <div class="pager-dots" id="pager-dots"></div>

    <script src="/static/todo.js?v=2"></script>
    <script src="/static/pager.js?v=2"></script>
    <script src="/static/app.js?v=2"></script>
</body>
</html>
